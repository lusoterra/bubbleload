# bubbleload generic profile -- the conservative default.
#
# It is used whenever there is no profile for the program being started.
# Copy it to <name>.conf in the same directory to give one program a
# tailored sandbox.  The built-in fallback template embedded in the
# bubbleload binary is generated from this very file.
#
# Everything is unshared and there is NO network access.  If the program
# needs the network (package managers, API clients, ...) uncomment the
# "share-net" line below: that joins the host network namespace, so loopback
# and DNS keep working.  The other namespaces stay unshared; "unshare-all"
# also unshares the user namespace, which is what allows the bind mounts
# below to work without root.
die-with-parent
unshare-all
# Uncomment for network access:
# share-net
hostname bwrap-generic

# Read-only base system.
ro-bind /usr /usr
symlink usr/bin /bin
symlink usr/bin /sbin
symlink usr/lib /lib
symlink usr/lib /lib64
ro-bind /etc /etc
resolv-conf

# Fresh /proc, /dev and /tmp.
proc /proc
dev /dev
tmpfs /tmp

# Private, empty $HOME: nothing from the real home directory is visible.
tmpfs $HOME
setenv HOME $HOME

# The project directory is the only writable host path, plus any -w/--rw
# directories from the command line (that is what "extra-binds" expands to).
# Move "extra-binds" if you want those mounts layered at another position;
# bwrap applies mounts in order, later ones win.
#
# The project directory is only mounted when $PROJECT is set, i.e. when the
# caller passes -P DIR or --cwd; otherwise only the directories listed above
# (and any -w/--rw ones) are visible, which is what keeps a run inside
# $HOME from being refused outright.  Pass --cwd (or -P .) to expose cwd.
extra-binds
project

# No display server by default: a sandboxed GUI program would otherwise be
# able to talk to the host compositor.
unsetenv DISPLAY
unsetenv WAYLAND_DISPLAY
unsetenv WAYLAND_SOCKET
unsetenv XAUTHORITY
