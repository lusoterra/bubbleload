# opencode sandbox -- faithful translation of the original bwrap-opencode
# shell script.  Install as $XDG_CONFIG_HOME/bubbleload/opencode.conf (or the
# basename of the binary you want to wrap) and run:
#
#     bubbleload --rw ../project-pkgbuild opencode -s session_id
#
die-with-parent
unshare-all
share-net
hostname bwrap-opencode

ro-bind /usr /usr
symlink usr/bin /bin
symlink usr/bin /sbin
symlink usr/lib /lib
symlink usr/lib /lib64
ro-bind /etc /etc
resolv-conf

proc /proc
dev /dev
tmpfs /tmp
mkdir /tmp/opencode
dir /tmp/opencode
bind /tmp/opencode /tmp/opencode

tmpfs $HOME
ro-bind $HOME/.config/zsh $HOME/.config/zsh
mkdir $HOME/.config/opencode
mkdir $HOME/.local/share/opencode
mkdir $HOME/.local/state/opencode
mkdir $HOME/.cache/opencode
bind $HOME/.config/opencode $HOME/.config/opencode
bind $HOME/.local/share/opencode $HOME/.local/share/opencode
bind $HOME/.local/state/opencode $HOME/.local/state/opencode
bind $HOME/.cache/opencode $HOME/.cache/opencode
ro-bind-try $HOME/.config/git $HOME/.config/git
mask $HOME/.config/git/credentials

extra-binds
project
setenv HOME $HOME

bind-try $HOME/.cache/npm $HOME/.cache/npm
bind-try $HOME/.local/share/npm $HOME/.local/share/npm
bind-try $HOME/.config/npm $HOME/.config/npm
bind-try $HOME/.local/bin $HOME/.local/bin
setenv npm_config_cache $HOME/.cache/npm

unsetenv DISPLAY
unsetenv WAYLAND_DISPLAY
unsetenv WAYLAND_SOCKET
unsetenv XAUTHORITY

exec opencode --standalone
